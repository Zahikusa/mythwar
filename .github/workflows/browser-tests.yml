# The end-to-end checks in a real browser: smoke (the game, every screen, phones and desktop) and
# mpsmoke (two browsers, a phone profile, a whole online session against the real server). They
# take a few minutes, so they run beside "Test & publish" rather than in front of it.
name: Browser tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # (Ubuntu 24.04 keeps Chrome's sandbox from using user namespaces; the runner is throwaway.)
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: echo "CHROME=$(command -v google-chrome || command -v google-chrome-stable)" >> "$GITHUB_ENV"
      - run: npm run smoke
      - run: node scripts/mpsmoke.ts
      # The release package as shipped starts and answers the lobby (no browser needed).
      - run: npm run package:check
