<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140f24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Mythwar: Ages of Legend</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mythwar" />
    <meta name="description" content="Out-think a rival in a tug-of-war of legends: summon creatures of five mythic ages down three lanes and topple their citadel. Any phone or computer, nothing to install — battle the gods, or a friend on the same Wi-Fi." />
    <!-- The link preview a chat shows for the game's link or an invite (Lens #95). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mythwar" />
    <meta property="og:title" content="Mythwar: Ages of Legend" />
    <meta property="og:description" content="Three lanes. Five mythic ages. One citadel left standing. Battle the gods, or a friend on the same Wi-Fi — on any phone or computer, nothing to install." />
    <meta property="og:image" content="https://zahikusa.github.io/mythwar/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mythwar: creatures of legend battling across three lanes between two citadels" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <!-- A browser too old for the game (an iPhone on iOS 15: no container queries — the whole
         phone layout — no color-mix, no structuredClone) says so plainly, instead of a broken
         layout or a crash. Plain old script: it runs even where the game's own can't. -->
    <script>
      (function () {
        var css = window.CSS && CSS.supports;
        var ok = !!css && CSS.supports('container-type: size') && CSS.supports('color', 'color-mix(in srgb, red, blue)') && !!Array.prototype.at && typeof structuredClone === 'function' && !!Object.hasOwn;
        window.__mythwarTooOld = !ok;
        if (ok) return;
        var box = document.createElement('div');
        box.className = 'tooold';
        box.setAttribute('style', 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0716;color:#f4ecff;font:17px/1.5 system-ui,-apple-system,sans-serif;text-align:center');
        box.innerHTML = '<div style="max-width:460px"><b style="font-size:22px;color:#ffe7a6">Mythwar needs a newer browser</b><br><br>On an iPhone or iPad: iOS 16.2 or later (Settings → General → Software Update). Elsewhere: a current Chrome, Edge, Firefox or Safari.</div>';
        document.body.appendChild(box);
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
